server.port=8089

# ---- MySQL (database is created automatically if missing) ----
spring.datasource.url=jdbc:mysql://localhost:3306/experiment_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.maximum-pool-size=10

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Generator defaults (override on the command line or in the UI) ----
app.seed=20261022
app.users=50000
app.experiments=10
# Folder where CSV/JSON/SQL exports, manifest and reports are written (relative to backend/)
app.export-dir=../exports
# Drop and recreate all tables on startup (useful after schema changes)
app.schema.drop-on-start=false
# Generate the full dataset on startup if the database is empty
app.generate-if-empty=true
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173
